# Release: per-commit prereleases plus tagged stable releases.
#
# Every push to master publishes `v<project-version>+<sha7>` as a prerelease.
# A manually pushed `v*` tag still publishes a normal stable release, provided
# its version matches build.gradle.kts. The JAR keeps the base version inside;
# only the public asset name gains SemVer-style commit metadata.
#
# ACTION PINNING POLICY: major-version tags (@v4/@v2) are used throughout,
# matching .github/workflows/ci.yml. For a hardened repository GitHub
# recommends pinning actions to full commit SHAs; swap `<action>@vN` for
# `<action>@<full-sha>` in a dedicated maintenance commit before public
# release if that policy is adopted.
#
# WRAPPER INTEGRITY: identical to ci.yml — gradle/actions/setup-gradle@v4 runs
# with validate-wrappers: true AND the wrapper JAR SHA-256 is pinned in a
# dedicated step (423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9,
# the official Gradle 8.14.5 wrapper JAR).
#
# RELEASE CONTRACT verified here (in addition to the JUnit release-artifact
# suite that runs in every `clean build`):
#   1. REPRODUCIBILITY: two `clean build --no-build-cache` runs must produce
#      byte-identical jar SHA-256 (ReleaseArtifactTest additionally pins the
#      two zip-level preconditions: constant entry timestamps + sorted order).
#   2. CHECKSUM: SHA256SUMS is generated with sha256sum over the final,
#      commit-qualified jar name.
#   3. SBOM: `./gradlew cyclonedxBom` (plugin org.cyclonedx.bom 2.4.1,
#      configured in build.gradle.kts — invoked, never reconfigured here)
#      emits build/reports/bom.json + build/reports/bom.xml, both published.
#      NOTE: the plugin's default run reports the full build graph (all
#      resolvable configurations, test deps included). The RELEASED artifact
#      itself has zero runtime dependencies — proven by the jar-tf whitelist
#      in ReleaseArtifactTest (no third-party entries) — not by this SBOM.
#   4. ATTESTATION: actions/attest-build-provenance@v2 attaches Sigstore
#      provenance to the jar.
#   5. PUBLISH: commit-qualified jar + SHA256SUMS + both SBOM files become
#      GitHub Release assets. NO Maven Central publication, no secrets, no
#      pull_request_target.
#
# Least privilege: the workflow default is contents: read; contents: write
# (release publish), attestations: write and id-token: write (provenance) are
# granted ONLY on the release job.

name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # A rapid second push must not cancel the release for the previous commit.
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, attest and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (validates wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify Gradle wrapper JAR checksum
        # Pinned SHA-256 of gradle/wrapper/gradle-wrapper.jar (official
        # Gradle 8.14.5 wrapper):
        # 423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9
        shell: bash
        run: |
          expected="423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9"
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "gradle-wrapper.jar sha256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::gradle-wrapper.jar checksum mismatch (expected $expected)"
            exit 1
          fi

      - name: Derive version, tag and artifact names
        shell: bash
        run: |
          set -euo pipefail
          project_version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts)
          if [ -z "$project_version" ] || [ "$(printf '%s\n' "$project_version" | wc -l)" -ne 1 ]; then
            echo "::error::could not derive exactly one project version from build.gradle.kts"
            exit 1
          fi

          commit_hash="${GITHUB_SHA:0:7}"
          build_jar_name="lavalink-go-librespot-${project_version}.jar"
          release_jar_name="lavalink-go-librespot-${project_version}+${commit_hash}.jar"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$project_version" ]; then
              echo "::error::tag version $tag_version does not match project version $project_version"
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
            release_name="$project_version"
            prerelease=false
          else
            release_tag="v${project_version}+${commit_hash}"
            release_name="${project_version}+${commit_hash}"
            prerelease=true
          fi

          {
            echo "PROJECT_VERSION=${project_version}"
            echo "BUILD_JAR_NAME=${build_jar_name}"
            echo "RELEASE_JAR_NAME=${release_jar_name}"
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_NAME=${release_name}"
            echo "IS_PRERELEASE=${prerelease}"
          } >> "$GITHUB_ENV"
          echo "Release ${release_tag}: ${build_jar_name} -> ${release_jar_name} (prerelease=${prerelease})"

      - name: Clean build #1 (release-artifact suite runs here)
        # --no-build-cache: the reproducibility comparison below must
        # re-execute the jar task, not serve the cached artifact.
        shell: bash
        run: ./gradlew clean build --no-daemon --no-build-cache

      - name: Record jar checksum (build #1)
        shell: bash
        run: |
          jar="build/libs/${BUILD_JAR_NAME}"
          if [ ! -f "$jar" ]; then
            echo "::error::expected release jar $jar does not exist"
            exit 1
          fi
          sha256sum "$jar" | tee /tmp/release-jar-sha-1.txt
          cp "$jar" /tmp/release-jar-1.jar

      - name: Clean build #2 (reproducibility)
        shell: bash
        run: ./gradlew clean build --no-daemon --no-build-cache

      - name: Assert reproducible jar (build #2 sha256 == build #1)
        shell: bash
        run: |
          jar="build/libs/${BUILD_JAR_NAME}"
          sha256sum "$jar" | tee /tmp/release-jar-sha-2.txt
          sha1=$(cut -d' ' -f1 /tmp/release-jar-sha-1.txt)
          sha2=$(cut -d' ' -f1 /tmp/release-jar-sha-2.txt)
          echo "build #1 sha256: $sha1"
          echo "build #2 sha256: $sha2"
          if [ "$sha1" != "$sha2" ]; then
            echo "::error::release jar is NOT reproducible (build #1 != build #2)"
            exit 1
          fi
          echo "Reproducible: both clean builds produced byte-identical jar"
          # Keep the verified build for diagnostics and create the public asset
          # name from the byte-identical second build.
          cp "$jar" /tmp/release-jar-2.jar
          cp "$jar" "build/libs/${RELEASE_JAR_NAME}"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          (cd build/libs && sha256sum "${RELEASE_JAR_NAME}") > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Generate CycloneDX SBOM
        # Invokes the org.cyclonedx.bom 2.4.1 task already configured in
        # build.gradle.kts; output lands in build/reports/ per plugin
        # convention (bom.json + bom.xml).
        shell: bash
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Verify SBOM parses and names our component
        shell: bash
        run: |
          python3 - "$GITHUB_WORKSPACE/build/reports/bom.json" <<'EOF'
          import json, os, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              bom = json.load(f)
          assert bom.get('bomFormat') == 'CycloneDX', 'not a CycloneDX BOM'
          comp = bom.get('metadata', {}).get('component', {})
          assert comp.get('name') == 'lavalink-go-librespot', comp
          assert comp.get('version') == os.environ['PROJECT_VERSION'], comp
          n = len(bom.get('components', []))
          print(f'SBOM OK: {comp["name"]} {comp["version"]}, {n} graph components '
                f'(build graph; the released jar has zero runtime deps per the '
                f'release-artifact suite)')
          EOF
          test -s build/reports/bom.json && test -s build/reports/bom.xml
          echo "bom.json and bom.xml present"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/libs/${{ env.RELEASE_JAR_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            build/libs/${{ env.RELEASE_JAR_NAME }}
            SHA256SUMS
            build/reports/bom.json
            build/reports/bom.xml
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
