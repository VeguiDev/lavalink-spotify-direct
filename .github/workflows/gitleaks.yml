# Gitleaks secret scan: full-history scan on every push and pull request.
#
# ACTION PINNING POLICY: major-version tags (@v2) — see ci.yml header;
# full-SHA pinning is recommended before public release.
# GITHUB_TOKEN is the ambient (not a hardcoded) token; the action needs it to
# fetch the repository. No other credentials are used.

name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
